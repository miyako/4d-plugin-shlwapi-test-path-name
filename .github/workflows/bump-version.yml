name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump (source commit only)
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate, bump source metadata and push selected branch
        env:
          BUMP_MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/release.py bump "$BUMP_MODE"

      - name: Summary
        run: |
          echo '### Source version committed; no tag, release or build was created. Run Build separately on the updated branch.' >> "$GITHUB_STEP_SUMMARY"
